[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-ai-reminder"
version = "1.0.0"
description = "Constraint-based personal scheduling secretary plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Biogod2020" }]
keywords = ["hermes", "scheduling", "calendar", "personal-assistant", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
solver = ["ortools>=9.10,<10"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.entry-points."hermes_agent.plugins"]
ai-reminder = "hermes_ai_reminder.plugin:register"

[project.urls]
Homepage = "https://github.com/Biogod2020/ai-reminder"
Repository = "https://github.com/Biogod2020/ai-reminder"

[tool.setuptools.packages.find]
include = ["hermes_ai_reminder*"]

[tool.setuptools.package-data]
hermes_ai_reminder = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["solver: tests requiring OR-Tools"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
