name: Apply Hermes rebuild

on:
  push:
    branches:
      - codex/hermes-sota-rebuild
    paths:
      - ".rebuild/**"
      - ".github/workflows/apply-hermes-rebuild.yml"

permissions:
  contents: write

concurrency:
  group: apply-hermes-rebuild
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and replace repository tree
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 6500 .rebuild/chunk-00a.b64
            cat .rebuild/chunk-00b.b64 \
              .rebuild/chunk-01.b64 \
              .rebuild/chunk-02.b64 \
              .rebuild/chunk-03.b64 \
              .rebuild/chunk-04.b64
          } | base64 --decode > /tmp/ai-reminder-rebuild.tar.gz
          echo "7d3d59043a53aa8eebcddf10b98eed6a5cb719b844bbe0767e6adde9c8fbafb8  /tmp/ai-reminder-rebuild.tar.gz" | sha256sum --check -

          cp .github/workflows/apply-hermes-rebuild.yml /tmp/apply-hermes-rebuild.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/ai-reminder-rebuild.tar.gz -C .
          mkdir -p .github/workflows
          cp /tmp/apply-hermes-rebuild.yml .github/workflows/apply-hermes-rebuild.yml
          rm -f .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat!: rebuild as Hermes-native scheduling secretary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
