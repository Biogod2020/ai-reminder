<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Soul Agent - Interactive Architecture</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide for icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Minimal React Flow Mock Styling */
        .node {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .node:hover {
            transform: translateY(-2px);
            border-color: #2383e2;
            box-shadow: 0 10px 15px -3px rgba(35, 131, 226, 0.1);
        }
        .node.active {
            border-color: #2383e2;
            background-color: #f0f7ff;
        }
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }
        .sidebar.closed {
            transform: translateX(100%);
        }
    </style>
</head>
<body class="bg-[#f7f6f3] text-[#37352f] h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="px-8 py-5 border-b border-[#e9e9e7] bg-white flex items-center justify-between z-10 shrink-0">
        <div>
            <div class="flex items-center gap-3 mb-1">
                <div class="w-6 h-6 bg-[#2383e2] rounded-md flex items-center justify-center">
                    <i data-lucide="network" class="text-white w-4 h-4"></i>
                </div>
                <h1 class="text-xl font-black tracking-tight">ARCHITECTURE ENGINE</h1>
            </div>
            <p class="text-xs text-[#787774] font-medium uppercase tracking-widest">Standalone Data-Driven Visualization</p>
        </div>
        <div class="flex items-center gap-4">
            <div class="px-3 py-1.5 rounded-full bg-[#f7f6f3] text-[10px] font-bold text-[#787774] border border-[#e9e9e7] flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                CONNECTED TO SQLITE
            </div>
            <button onclick="location.reload()" class="p-2 hover:bg-[#f7f6f3] rounded-full transition-colors">
                <i data-lucide="refresh-cw" class="w-4 h-4 text-[#787774]"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Graph Canvas (Mocked Interactive Logic) -->
        <div id="canvas" class="flex-1 p-12 overflow-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-start align-start content-start">
            <!-- Nodes will be injected here -->
            <div class="col-span-full text-center py-20 opacity-50" id="loader">
                <div class="animate-spin mb-4 inline-block">
                    <i data-lucide="loader-2" class="w-8 h-8 text-[#2383e2]"></i>
                </div>
                <p>Fetching node metadata from database...</p>
            </div>
        </div>

        <!-- Detail Sidebar -->
        <aside id="sidebar" class="sidebar closed fixed right-0 top-0 bottom-0 w-[450px] bg-white border-l border-[#e9e9e7] shadow-2xl z-30 flex flex-col">
            <div class="p-8 flex flex-col h-full overflow-y-auto">
                <div class="flex items-center justify-between mb-10">
                    <div class="px-3 py-1 bg-[#2383e2]/10 text-[#2383e2] text-[10px] font-bold rounded-full uppercase tracking-[0.2em]">
                        Metadata Insight
                    </div>
                    <button onclick="closeSidebar()" class="p-2 hover:bg-[#f7f6f3] rounded-full transition-colors">
                        <i data-lucide="x" class="w-5 h-5 text-[#787774]"></i>
                    </button>
                </div>

                <div id="node-header" class="mb-10 flex items-center gap-5">
                    <!-- Dynamic Content -->
                </div>

                <div class="space-y-10" id="node-details">
                    <!-- Dynamic Content -->
                </div>

                <div class="mt-auto pt-12 border-t border-[#e9e9e7] text-[10px] text-[#787774] text-center uppercase tracking-[0.3em] font-bold">
                    NSA Core System
                </div>
            </div>
        </aside>
    </main>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/viz/nodes';
        let nodesData = [];

        async function init() {
            lucide.createIcons();
            await fetchNodes();
        }

        async function fetchNodes() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('API offline');
                nodesData = await res.json();
                renderGraph();
            } catch (err) {
                document.getElementById('loader').innerHTML = `
                    <div class="text-red-500 mb-4"><i data-lucide="alert-circle" class="w-12 h-12 mx-auto"></i></div>
                    <p class="font-bold text-red-500">Failed to connect to Backend</p>
                    <p class="text-xs mt-2 text-[#787774]">Please run 'uvicorn core.api:app'</p>
                `;
                lucide.createIcons();
            }
        }

        function renderGraph() {
            const canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            
            nodesData.forEach(node => {
                const el = document.createElement('div');
                el.className = 'node bg-white border-2 border-[#e9e9e7] rounded-xl p-5 shadow-sm flex flex-col gap-3 relative';
                el.onclick = () => showDetails(node.node_id);
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-lg bg-[#f7f6f3] flex items-center justify-center text-[#2383e2]">
                            <i data-lucide="cpu" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm leading-tight capitalize">${node.node_id.replace('_', ' ')}</h3>
                            <p class="text-[10px] text-[#787774] font-medium uppercase tracking-wider">${node.role}</p>
                        </div>
                    </div>
                    <div class="h-px bg-[#e9e9e7] w-full"></div>
                    <div class="flex gap-2">
                        <span class="px-2 py-0.5 rounded bg-[#f7f6f3] text-[9px] font-bold text-[#787774] border border-[#e9e9e7]">DYNAMIC</span>
                        <span class="px-2 py-0.5 rounded bg-[#2383e2]/5 text-[9px] font-bold text-[#2383e2] border border-[#2383e2]/10 uppercase tracking-tighter">LangGraph Node</span>
                    </div>
                `;
                canvas.appendChild(el);
            });
            lucide.createIcons();
        }

        function showDetails(nodeId) {
            const node = nodesData.find(n => n.node_id === nodeId);
            if (!node) return;

            const header = document.getElementById('node-header');
            const details = document.getElementById('node-details');

            header.innerHTML = `
                <div class="w-16 h-16 rounded-2xl bg-[#2383e2] flex items-center justify-center text-white shadow-xl shadow-[#2383e2]/20">
                    <i data-lucide="cpu" class="w-8 h-8"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-[#37352f] leading-none mb-1 capitalize">${node.node_id.replace('_', ' ')}</h2>
                    <p class="text-xs text-[#787774] font-bold uppercase tracking-[0.1em]">${node.role}</p>
                </div>
            `;

            details.innerHTML = `
                <section>
                    <h3 class="text-[11px] font-black text-[#787774] uppercase tracking-[0.25em] mb-4 flex items-center gap-3">
                        <i data-lucide="book-open" class="w-4 h-4"></i> Description
                    </h3>
                    <div class="bg-[#f7f6f3] p-6 rounded-2xl border border-[#e9e9e7] text-sm leading-relaxed text-[#37352f] italic">
                        "${node.description}"
                    </div>
                </section>

                <section>
                    <h3 class="text-[11px] font-black text-[#787774] uppercase tracking-[0.25em] mb-4 flex items-center gap-3">
                        <i data-lucide="code-2" class="w-4 h-4"></i> Implementation
                    </h3>
                    <div class="bg-[#1e1e1e] p-4 rounded-xl text-[#d4d4d4] text-xs font-mono break-all border border-black/50 shadow-inner">
                        ${node.code_mapping}
                    </div>
                </section>

                <section>
                    <h3 class="text-[11px] font-black text-[#787774] uppercase tracking-[0.25em] mb-4 flex items-center gap-3">
                        <i data-lucide="git-branch" class="w-4 h-4"></i> I/O Schema
                    </h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-white border border-[#e9e9e7] rounded-xl">
                            <p class="text-[9px] font-bold text-[#787774] uppercase mb-1">Input</p>
                            <p class="text-xs font-bold text-[#2383e2]">${node.io_schema.type || 'AgentState'}</p>
                        </div>
                        <div class="p-4 bg-white border border-[#e9e9e7] rounded-xl">
                            <p class="text-[9px] font-bold text-[#787774] uppercase mb-1">Output</p>
                            <p class="text-xs font-bold text-[#2383e2]">${node.io_schema.output || 'AgentState'}</p>
                        </div>
                    </div>
                </section>
            `;

            document.getElementById('sidebar').classList.remove('closed');
            lucide.createIcons();
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.add('closed');
        }

        window.onload = init;
    </script>
</body>
</html>
