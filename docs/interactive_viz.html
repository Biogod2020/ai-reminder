<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Soul Agent - Interactive Architecture</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide for icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }
        .sidebar.closed {
            transform: translateX(100%);
        }
        
        /* Mermaid Styling Overrides */
        .mermaid {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .node rect, .node circle, .node ellipse, .node polygon, .node path {
            fill: #ffffff !important;
            stroke: #e9e9e7 !important;
            stroke-width: 2px !important;
            transition: all 0.2s ease;
        }
        .node:hover rect, .node:hover circle, .node:hover ellipse, .node:hover polygon, .node:hover path {
            stroke: #2383e2 !important;
            filter: drop-shadow(0 4px 6px rgba(35, 131, 226, 0.1));
            cursor: pointer;
        }
        .node .label {
            font-family: 'Inter', sans-serif !important;
            font-weight: 600 !important;
            fill: #37352f !important;
        }
        .edgePath path {
            stroke: #e9e9e7 !important;
            stroke-width: 2px !important;
        }
        .edgeLabel {
            background-color: #f7f6f3 !important;
            font-family: 'Inter', sans-serif !important;
            font-size: 10px !important;
            color: #787774 !important;
        }
    </style>
</head>
<body class="bg-[#f7f6f3] text-[#37352f] h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="px-8 py-5 border-b border-[#e9e9e7] bg-white flex items-center justify-between z-10 shrink-0">
        <div>
            <div class="flex items-center gap-3 mb-1">
                <div class="w-6 h-6 bg-[#2383e2] rounded-md flex items-center justify-center">
                    <i data-lucide="network" class="text-white w-4 h-4"></i>
                </div>
                <h1 class="text-xl font-black tracking-tight uppercase">Architecture Engine</h1>
            </div>
            <p class="text-xs text-[#787774] font-medium uppercase tracking-widest">Interactive LangGraph Visualization</p>
        </div>
        <div class="flex items-center gap-4">
            <div class="px-3 py-1.5 rounded-full bg-[#f7f6f3] text-[10px] font-bold text-[#787774] border border-[#e9e9e7] flex items-center gap-2">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                LIVE CORE CONNECTED
            </div>
            <button onclick="location.reload()" class="p-2 hover:bg-[#f7f6f3] rounded-full transition-colors">
                <i data-lucide="refresh-cw" class="w-4 h-4 text-[#787774]"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Graph Canvas -->
        <div id="canvas-container" class="flex-1 overflow-hidden flex items-center justify-center p-8 bg-[#fbfbfa]">
            <div id="mermaid-graph" class="mermaid opacity-0 transition-opacity duration-500">
                <!-- Mermaid SVG will be rendered here -->
            </div>
            
            <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-[#f7f6f3]/80 z-20 transition-opacity">
                <div class="animate-spin mb-4 inline-block text-[#2383e2]">
                    <i data-lucide="loader-2" class="w-10 h-10"></i>
                </div>
                <p class="font-bold text-[#787774] uppercase tracking-widest text-xs">Synthesizing Graph...</p>
            </div>
        </div>

        <!-- Detail Sidebar -->
        <aside id="sidebar" class="sidebar closed fixed right-0 top-0 bottom-0 w-[450px] bg-white border-l border-[#e9e9e7] shadow-2xl z-30 flex flex-col">
            <div class="p-8 flex flex-col h-full overflow-y-auto">
                <div class="flex items-center justify-between mb-10">
                    <div class="px-3 py-1 bg-[#2383e2]/10 text-[#2383e2] text-[10px] font-bold rounded-full uppercase tracking-[0.2em]">
                        Node Intelligence
                    </div>
                    <button onclick="closeSidebar()" class="p-2 hover:bg-[#f7f6f3] rounded-full transition-colors">
                        <i data-lucide="x" class="w-5 h-5 text-[#787774]"></i>
                    </button>
                </div>

                <div id="node-header" class="mb-10 flex items-center gap-5">
                    <!-- Dynamic Content -->
                </div>

                <div class="space-y-10" id="node-details">
                    <!-- Dynamic Content -->
                </div>

                <div class="mt-auto pt-12 border-t border-[#e9e9e7] text-[10px] text-[#787774] text-center uppercase tracking-[0.3em] font-bold">
                    System Architecture Insight
                </div>
            </div>
        </aside>
    </main>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

        const API_NODES = 'http://localhost:8000/api/v1/viz/nodes';
        const API_GRAPH = 'http://localhost:8000/api/v1/viz/graph';
        
        let nodesMetadata = [];

        // Global callback for Mermaid click events
        window.handleNodeClick = function(nodeId) {
            console.log("Clicked node:", nodeId);
            const cleanId = nodeId.replace(/["']/g, ''); // Clean quotes if any
            showDetails(cleanId);
        };

        async function init() {
            lucide.createIcons();
            
            // Initialize Mermaid with 'loose' security to allow click events
            mermaid.initialize({ 
                startOnLoad: false,
                securityLevel: 'loose',
                theme: 'neutral',
                fontFamily: 'Inter',
                flowchart: {
                    useMaxWidth: false,
                    htmlLabels: true,
                    curve: 'basis'
                }
            });

            await fetchAndRender();
        }

        async function fetchAndRender() {
            try {
                const [nodesRes, graphRes] = await Promise.all([
                    fetch(API_NODES),
                    fetch(API_GRAPH)
                ]);

                if (!nodesRes.ok || !graphRes.ok) throw new Error('API offline');

                nodesMetadata = await nodesRes.json();
                const graphData = await graphRes.json();
                
                let mermaidDefinition = graphData.mermaid;
                
                // Enhanced Mermaid Definition: Add click handlers for all nodes
                const nodeIds = nodesMetadata.map(n => n.node_id);
                nodeIds.forEach(id => {
                    // Syntax: click nodeID call handleNodeClick("nodeID")
                    mermaidDefinition += `\n    click ${id} call handleNodeClick("${id}")`;
                });

                const container = document.getElementById('mermaid-graph');
                const { svg, bindFunctions } = await mermaid.render('architecture-graph', mermaidDefinition);
                
                container.innerHTML = svg;
                container.classList.remove('opacity-0');
                document.getElementById('loader').classList.add('opacity-0');
                setTimeout(() => document.getElementById('loader').remove(), 500);

                if (bindFunctions) {
                    bindFunctions(container);
                }

            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerHTML = `
                    <div class="text-red-500 mb-4"><i data-lucide="alert-circle" class="w-12 h-12 mx-auto"></i></div>
                    <p class="font-bold text-red-500 uppercase tracking-tighter text-sm">System Backend Offline</p>
                    <p class="text-[10px] mt-2 text-[#787774] font-medium uppercase tracking-widest">Run: uvicorn core.api:app</p>
                `;
                lucide.createIcons();
            }
        }

        function showDetails(nodeId) {
            const node = nodesMetadata.find(n => n.node_id === nodeId);
            if (!node) {
                // If node metadata is missing (e.g. entry/end nodes), don't show sidebar
                if (['__start__', '__end__'].includes(nodeId)) return;
                console.warn("No metadata for node:", nodeId);
                return;
            }

            const header = document.getElementById('node-header');
            const details = document.getElementById('node-details');

            header.innerHTML = `
                <div class="w-16 h-16 rounded-2xl bg-[#2383e2] flex items-center justify-center text-white shadow-xl shadow-[#2383e2]/20">
                    <i data-lucide="cpu" class="w-8 h-8"></i>
                </div>
                <div>
                    <h2 class="text-2xl font-black text-[#37352f] leading-none mb-1 capitalize">${node.node_id.replace(/_/g, ' ')}</h2>
                    <p class="text-xs text-[#787774] font-bold uppercase tracking-[0.1em]">${node.role}</p>
                </div>
            `;

            details.innerHTML = `
                <section>
                    <h3 class="text-[11px] font-black text-[#787774] uppercase tracking-[0.25em] mb-4 flex items-center gap-3">
                        <i data-lucide="book-open" class="w-4 h-4"></i> Description
                    </h3>
                    <div class="bg-[#f7f6f3] p-6 rounded-2xl border border-[#e9e9e7] text-sm leading-relaxed text-[#37352f] italic">
                        "${node.description}"
                    </div>
                </section>

                <section>
                    <h3 class="text-[11px] font-black text-[#787774] uppercase tracking-[0.25em] mb-4 flex items-center gap-3">
                        <i data-lucide="code-2" class="w-4 h-4"></i> Source Implementation
                    </h3>
                    <div class="bg-[#1e1e1e] p-4 rounded-xl text-[#d4d4d4] text-xs font-mono break-all border border-black/50 shadow-inner">
                        ${node.code_mapping}
                    </div>
                </section>

                <section>
                    <h3 class="text-[11px] font-black text-[#787774] uppercase tracking-[0.25em] mb-4 flex items-center gap-3">
                        <i data-lucide="git-branch" class="w-4 h-4"></i> Input/Output Pattern
                    </h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-4 bg-white border border-[#e9e9e7] rounded-xl">
                            <p class="text-[9px] font-bold text-[#787774] uppercase mb-1">Incoming</p>
                            <p class="text-xs font-bold text-[#2383e2]">${node.io_schema.type || 'AgentState'}</p>
                        </div>
                        <div class="p-4 bg-white border border-[#e9e9e7] rounded-xl">
                            <p class="text-[9px] font-bold text-[#787774] uppercase mb-1">Outgoing</p>
                            <p class="text-xs font-bold text-[#2383e2]">${node.io_schema.output || 'AgentState'}</p>
                        </div>
                    </div>
                </section>
            `;

            document.getElementById('sidebar').classList.remove('closed');
            lucide.createIcons();
        }

        window.closeSidebar = function() {
            document.getElementById('sidebar').classList.add('closed');
        };

        window.onload = init;
    </script>
</body>
</html>
